[project]
name = "waymo_av"
version = "0.1.0"
description = "Robust joint motion forecasting under missing and noisy observations (simplified MotionLM-style, WOMD)"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
