# Control: matched extra supervised training from the same dev-selected M1 checkpoint (same lr/steps as RL).
run_name: extra_sft_pilot_s0
init_from: REPLACE_WITH_RUNS_DIR/m1_pilot_s0/ckpt_best.pt
train_manifest: manifests/train.json
dev_manifest: manifests/dev.json
corruption: mixture
seed: 0
model: {d_model: 128, n_heads: 4, d_ff: 512, n_latents: 64, enc_layers: 2, dec_layers: 4, dropout: 0.1, max_agent_slots: 32, independent: false}
batch_size: 32
lr: 0.00002
warmup_steps: 20
total_steps: 600
schedule: linear
weight_decay: 0.1
grad_clip: 1.0
log_every: 50
eval_every: 600
dev_eval_scenes: 256
eval_batch_size: 64
num_workers: 8
amp: true
planned_gpu_hours: 0.5
